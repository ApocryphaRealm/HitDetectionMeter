[General]

; 1 = when something hits you, a marker on a ring round the middle of the screen shows which way the hit came from.
bEnabled=1

; 1 = hits from followers and from anyone not hostile to you draw a marker too. 0 = only hits from hostile actors.
; Hits you deal yourself never draw one.
bShowFriendlyHits=1

; Seconds a marker takes to fade out after the hit.
fDuration=1.50

; A multiple of the art's own size (1 = the size of Detection Meter's markers, or of the Nordic marker).
fSize=1.00

; How solid the strongest hit's marker is, 0 to 1. Power attacks draw at this; ordinary hits at 0.7 of it;
; bash hits at 0.85; a hit you blocked at six tenths of what it would have been.
fOpacity=1.00

; The tint, 0 to 255 each. White (255, 255, 255) draws the art as it is.
iColorR=255
iColorG=255
iColorB=255

; Each attacker has one marker, which a new hit from it brightens again. Past this many, the oldest goes.
iMaxMarkers=8

[Ring]

; With Detection Meter installed, the hit markers wear its art (whichever art pack you chose for it) and sit on a ring
; fRingOffset pixels from its own: negative is closer to the character (inside it), positive is further out. The default,
; -40, keeps the hit markers between your character and the detection markers, never on top of them.
; Its ring's size and centre are read from MaxsuDetectionMeter.ini.
fRingOffset=-40

; Without Detection Meter: the ring's radius, and its centre's offset from the middle of the screen (pixels).
; These are Detection Meter's own defaults; fRingOffset is added to the radius here too.
fRadius=305
fCenterOffsetX=0
fCenterOffsetY=-48

[Debug]

; 0 trace, 1 debug, 2 info, 3 warnings, 4 errors. Raise to 0 to capture everything for a bug report.
uLogLevel=2
